name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:boundaries
      - run: pnpm check:licenses
      - run: pnpm build

  # The built web app served by the real API against a throwaway SQLite file, in a real browser.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @orbit/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @orbit/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  # The Docker image: build, start, browser suite, backup, destroy the data, restore, reset a password.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Upgrade from the previous reachable release, or the documented baseline.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orbit/e2e exec playwright install --with-deps chromium
      - run: RUN_E2E=1 deploy/smoke-test.sh
      - run: ORBIT_UPGRADE_TO_IMAGE=ghcr.io/scottlinddk/orbit:latest deploy/upgrade-test.sh

  docker-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: deploy/smoke-test.sh
      - run: ORBIT_UPGRADE_TO_IMAGE=ghcr.io/scottlinddk/orbit:latest deploy/upgrade-test.sh
